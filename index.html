<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystery Chest Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #141423, #080811); color: white; font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; overflow: hidden; user-select: none; }
        .header { margin-top: 20px; font-size: 1.8rem; font-weight: bold; letter-spacing: 2px; color: #f39c12; }
        .coins-display { background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 20px; font-size: 1.2rem; font-weight: bold; margin-top: 5px; }
        .chest-box { width: 180px; height: 180px; background: radial-gradient(circle, #f39c12, #d35400); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 4.5rem; cursor: pointer; transition: transform 0.1s; }
        .chest-box:active { transform: scale(0.9); }
        .open-btn { margin-top: 25px; padding: 12px 35px; background: #27ae60; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
        .inventory { display: flex; gap: 10px; overflow-x: auto; padding: 10px; width: 90%; }
        .card-slot { min-width: 75px; height: 100px; background: #2c3e50; border: 1px solid #7f8c8d; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">MYSTERY CHEST</div>
    <div class="coins-display">💰 <span id="coin-count">0</span> COINS</div>

    <div class="main-container">
        <div class="chest-box" id="chest" onclick="openChest()">📦</div>
        <button class="open-btn" onclick="openChest()">OPEN (FREE)</button>
    </div>

    <div class="inventory" id="inventory"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Firebase URL ထည့်ပေးလိုက်ပါပြီ
        const DATABASE_URL = "https://mystery-chest-game-default-rtdb.asia-southeast1.firebasedatabase.app/"; 
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "guest_123";

        let coins = 0;
        let myCards = [];

        async function loadData() {
            const response = await fetch(`${DATABASE_URL}users/${userId}.json`);
            const data = await response.json();
            if(data) {
                coins = data.coins || 0;
                myCards = data.cards || [];
            }
            updateUI();
        }

        function saveData() {
            fetch(`${DATABASE_URL}users/${userId}.json`, {
                method: 'PUT',
                body: JSON.stringify({ coins: coins, cards: myCards })
            });
        }

        const cardPool = [
            { id: 1, name: "Dragon", tier: "LEGENDARY", value: 50, icon: "🐲" },
            { id: 2, name: "Phoenix", tier: "LEGENDARY", value: 50, icon: "🦅" },
            { id: 3, name: "Sword", tier: "COMMON", value: 10, icon: "⚔️" }
        ];

        function updateUI() {
            document.getElementById('coin-count').innerText = coins;
            const inv = document.getElementById('inventory');
            inv.innerHTML = '';
            myCards.forEach((card, index) => {
                const slot = document.createElement('div');
                slot.className = `card-slot`;
                slot.innerHTML = `<div>${card.icon}</div><div>${card.name}</div><div style="color:#f1c40f">+${card.value}</div>`;
                slot.onclick = () => tradeCard(index);
                inv.appendChild(slot);
            });
        }

        function openChest() {
            const rolled = cardPool[Math.floor(Math.random() * cardPool.length)];
            myCards.push(rolled);
            saveData();
            updateUI();
        }

        function tradeCard(index) {
            coins += myCards[index].value;
            myCards.splice(index, 1);
            saveData();
            updateUI();
        }

        loadData();
    </script>
</body>
</html>
