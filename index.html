<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Chest Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        :root {
            --bg-color: #0c0f1d;
            --primary-color: #f1c40f;
            --card-bg: #151a33;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background-color: #1a203f;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-bottom: 2px solid #2c3e50;
        }
        .header span { color: var(--primary-color); }
        .sub-header { font-size: 12px; color: #a29bfe; margin-top: 5px; }

        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .page { display: none; text-align: center; }
        .page.active { display: block; }

        /* ========================================================
           CHEST OPENING ANIMATION (NO LOCK ICON)
        ======================================================== */
        .chest-container {
            position: relative;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            perspective: 1000px;
        }
        .chest-icon {
            font-size: 90px;
            transition: all 0.3s ease;
            cursor: pointer;
            z-index: 5;
        }
        /* သေတ္တာခါတဲ့ Animation */
        .shake { animation: chestShake 0.4s infinite; }
        @keyframes chestShake {
            0% { transform: rotate(0); }
            25% { transform: rotate(5deg); }
            50% { transform: rotate(0); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0); }
        }

        .btn {
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            color: #111; border: none; padding: 13px 30px;
            font-size: 15px; font-weight: bold; border-radius: 25px;
            cursor: pointer; width: 80%; max-width: 300px;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .btn:disabled { background: #7f8c8d; color: #fff; cursor: not-allowed; box-shadow: none; }

        /* ========================================================
           DYNAMIC CARD POP-UP AREA
        ======================================================== */
        .card-display-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
            margin-top: 5px;
        }

        /* Mini Card Design (From your preference) */
        .poke-card {
            width: 145px;
            height: 210px;
            border-radius: 10px;
            padding: 6px;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background: #1e2544;
            border: 2.5px solid #7f8c8d;
        }
        .card-inner {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            height: 100%;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background: rgba(15, 18, 37, 0.6);
        }
        .card-header-info { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 11px; }
        .card-hp { color: #ff7675; font-size: 9px; }
        .card-img-window {
            background: #090b14; border: 1px solid #57606f; height: 75px;
            border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 4px 0;
        }
        .card-body-info { background: rgba(0, 0, 0, 0.5); border-radius: 4px; padding: 5px; font-size: 9px; text-align: center; }
        .card-ability { font-weight: bold; color: #f1c40f; }
        .card-count-badge {
            position: absolute; top: -6px; right: -6px; background: #e74c3c; color: white;
            font-size: 10px; font-weight: bold; padding: 2px 7px; border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4); border: 1px solid white; z-index: 10;
        }

        /* --- THEME BORDERS & GLOWS --- */
        .poke-card.common-bug { border-color: #27ae60; }
        .poke-card.common-fire { border-color: #e67e22; }
        .poke-card.common-water { border-color: #2980b9; }
        .poke-card.common-normal { border-color: #7f8c8d; }
        .poke-card.rare { border-color: #f1c40f; background: linear-gradient(135deg, #f1c40f, #1e2544); animation: rareFlash 1s ease-in-out infinite alternate; }
        .poke-card.legendary { border-color: #9b59b6; background: linear-gradient(45deg, #8e44ad, #d63031, #2c3e50, #9b59b6); background-size: 300% 300%; animation: holoMoving 3s ease infinite, legendaryFire 1.2s infinite alternate; }

        @keyframes holoMoving { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes rareFlash { from { box-shadow: 0 0 8px #f1c40f; } to { box-shadow: 0 0 20px #f1c40f; border-color: #fff; } }
        @keyframes legendaryFire { from { box-shadow: 0 0 15px #9b59b6; } to { box-shadow: 0 0 35px #9b59b6, 0 0 15px #ff7675; border-color: #fff; } }

        /* Card Flying Up from Box Animation */
        .fly-up {
            animation: cardFlyIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes cardFlyIn {
            0% { transform: translateY(50px) scale(0); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Binder Grid */
        .pokemon-deck { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; justify-items: center; margin-top: 20px; }

        input { width: 80%; max-width: 300px; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #34495e; background-color: #1f233e; color: white; text-align: center; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background-color: #151a33; height: 75px; display: flex; justify-content: space-around; align-items: center; border-top: 2px solid #2c3e50; }
        .nav-item { color: #7f8c8d; cursor: pointer; font-size: 12px; display: flex; flex-direction: column; align-items: center; flex: 1; }
        .nav-item .icon { font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        💰 Points: <span id="global-points">0</span> | ⚡ Energy: <span id="global-energy">5</span>
        <div class="sub-header">Current Card Buff: +<span id="bonus-points">0</span> Points/Chest</div>
    </div>

    <div class="content-container">
        
        <div id="page-box" class="page active">
            <h2>Lucky Mystery Chest 🎁</h2>
            <div class="chest-container">
                <div class="chest-icon" id="chest-emoji">📦</div>
            </div>
            <button class="btn" id="btn-open-chest" onclick="tryOpenChest()">OPEN CHEST (1 Energy)</button>
            
            <div class="card-display-zone" id="box-card-output">
                <p style="color: #57606f; font-style: italic; font-size: 13px;">Open the chest to reveal your Pokemon!</p>
            </div>
        </div>

        <div id="page-energy" class="page">
            <h2>Refill Energy ⚡</h2>
            <div style="font-size: 80px; margin: 20px;">🎬</div>
            <button class="btn" id="ad-button" onclick="watchAdForEnergy()">WATCH ADS (+3 Energy)</button>
        </div>

        <div id="page-cards" class="page">
            <h2>Your Binder 🎴</h2>
            <div class="pokemon-deck" id="collection-container"></div>
        </div>

        <div id="page-withdraw" class="page">
            <h2>Withdraw 💰</h2>
            <div style="font-size: 60px; margin: 10px;">🏦</div>
            <input type="number" id="withdraw-amount" placeholder="Enter Points Amount">
            <input type="text" id="wallet-address" placeholder="Enter USDT (TON) Address">
            <br><br>
            <button class="btn" onclick="requestWithdraw()">WITHDRAW NOW</button>
        </div>

    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('page-box', this)">
            <div class="icon">🎁</div><div>Box</div>
        </div>
        <div class="nav-item" onclick="switchPage('page-energy', this)">
            <div class="icon">⚡</div><div>Earn</div>
        </div>
        <div class="nav-item" onclick="switchPage('page-cards', this)">
            <div class="icon">🎴</div><div>Binder</div>
        </div>
        <div class="nav-item" onclick="switchPage('page-withdraw', this)">
            <div class="icon">💰</div><div>Wallet</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const adController = window.Adsgram.init({ blockId: "34291" });

        let points = 0;
        let energy = 5;
        let totalBonus = 0;
        let myCards = {};

        const pokemonDatabase = [
            { name: "Caterpie", emoji: "🐛", style: "common-bug", hp: "40HP", bonus: 2, minRoll: 1, maxRoll: 18 },
            { name: "Charmander", emoji: "🔥", style: "common-fire", hp: "60HP", bonus: 2, minRoll: 19, maxRoll: 36 },
            { name: "Squirtle", emoji: "💧", style: "common-water", hp: "50HP", bonus: 2, minRoll: 37, maxRoll: 54 },
            { name: "Pidgey", emoji: "🦅", style: "common-normal", hp: "40HP", bonus: 2, minRoll: 55, maxRoll: 70 },
            { name: "Pikachu", emoji: "⚡", style: "rare", hp: "70HP", bonus: 5, minRoll: 71, maxRoll: 95 },
            { name: "Mewtwo", emoji: "🔮", style: "legendary", hp: "120HP", bonus: 20, minRoll: 96, maxRoll: 100 }
        ];

        function switchPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            if(pageId === 'page-cards') renderCollection();
        }

        function updateUI() {
            document.getElementById('global-points').innerText = points;
            document.getElementById('global-energy').innerText = energy;
            document.getElementById('bonus-points').innerText = totalBonus;
        }

        // Chest Reveal Logic
        function tryOpenChest() {
            if (energy < 1) { alert("⚡ No energy left!"); return; }

            energy -= 1;
            const chest = document.getElementById('chest-emoji');
            const outputZone = document.getElementById('box-card-output');

            // ၁။ သေတ္တာကို အရင်ခါမယ်
            chest.classList.add('shake');
            outputZone.innerHTML = `<p style="color: #f1c40f; font-weight:bold;">Opening...</p>`;

            let roll = Math.floor(Math.random() * 100) + 1;
            let rewardCard = pokemonDatabase.find(p => roll >= p.minRoll && roll <= p.maxRoll);

            if (myCards[rewardCard.name]) { myCards[rewardCard.name].count += 1; } 
            else { myCards[rewardCard.name] = { ...rewardCard, count: 1 }; }

            totalBonus += rewardCard.bonus;
            points += rewardCard.bonus;

            setTimeout(() => {
                // ၂။ သေတ္တာအဖုံးပွင့်သွားမယ် (🎊 ပေါ်လာမယ်)
                chest.classList.remove('shake');
                chest.innerText = "🎊"; 

                // ၃။ ကတ်က သေတ္တာထဲကနေ အပေါ်ကို လွင့်တက်လာမယ်
                outputZone.innerHTML = `
                    <div class="poke-card ${rewardCard.style} fly-up">
                        <div class="card-inner">
                            <div class="card-header-info">
                                <div>${rewardCard.name}</div>
                                <div class="card-hp">${rewardCard.hp}</div>
                            </div>
                            <div class="card-img-window">${rewardCard.emoji}</div>
                            <div class="card-body-info"><div class="card-ability">⚡ +${rewardCard.bonus} Pts</div></div>
                        </div>
                    </div>
                `;
                updateUI();

                // ၄။ ခဏကြာရင် သေတ္တာကို မူလ (📦) ပြန်ပြောင်းမယ်
                setTimeout(() => { chest.innerText = "📦"; }, 2000);

            }, 800);
        }

        function renderCollection() {
            const container = document.getElementById('collection-container');
            container.innerHTML = "";
            if (Object.keys(myCards).length === 0) {
                container.innerHTML = `<p style="color: #7f8c8d; grid-column: span 2; margin-top: 40px;">No cards yet!</p>`;
                return;
            }
            Object.values(myCards).forEach(card => {
                const cardHTML = `<div class="poke-card ${card.style}"><div class="card-count-badge">x${card.count}</div><div class="card-inner"><div class="card-header-info"><div>${card.name}</div><div class="card-hp">${card.hp}</div></div><div class="card-img-window">${card.emoji}</div><div class="card-body-info"><div class="card-ability">⚡ +${card.bonus * card.count} Pts</div></div></div></div>`;
                container.innerHTML += cardHTML;
            });
        }

        function watchAdForEnergy() {
            const adButton = document.getElementById("ad-button");
            adButton.disabled = true; adButton.innerText = "Loading Ad...";
            adController.show().then(() => { energy += 3; updateUI(); })
            .catch(() => { alert("Ad Failed."); })
            .finally(() => { adButton.disabled = false; adButton.innerText = "WATCH ADS (+3 Energy)"; });
        }

        function requestWithdraw() {
            const amount = parseInt(document.getElementById('withdraw-amount').value);
            const address = document.getElementById('wallet-address').value;
            if (!amount || !address || points < amount || amount < 1000) { alert("Invalid inputs."); return; }
            points -= amount;
            alert(`Requested withdrawal of ${amount} Points.`);
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
