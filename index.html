<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Chest Game</title>
    
    <!-- 1. Telegram Web Apps Script ချိတ်ဆက်ခြင်း -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- 2. Adsgram Script ချိတ်ဆက်ခြင်း (ကြော်ငြာအတွက် မရှိမဖြစ်) -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }
        .chest-container {
            margin: 30px 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .chest-container:active {
            transform: scale(0.95);
        }
        .chest-icon {
            font-size: 80px;
        }
        .btn {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #e67e22;
        }
        .btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
            box-shadow: none;
        }
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <h1>Mystery Chest Game 🎁</h1>
    <p>ကြော်ငြာကြည့်ပြီး လျှို့ဝှက်သေတ္တာကို ဖွင့်လိုက်ပါ</p>

    <!-- သေတ္တာပုံစံပြသသည့်နေရာ -->
    <div class="chest-container" id="chest-box">
        <div class="chest-icon" id="chest-emoji">📦</div>
    </div>

    <!-- ကြော်ငြာကြည့်ပြီး သေတ္တာဖွင့်မည့် ခလုတ် -->
    <button class="btn" id="ad-button" onclick="watchAdAndOpenChest()">
        WATCH ADS TO OPEN
    </button>

    <div class="status" id="status-text">သေတ္တာပိတ်ထားပါသည်</div>

    <script>
        // Telegram Web App ကို စတင်ပတ်သက်ခြင်း
        const tg = window.Telegram.WebApp;
        tg.expand(); // Screen ကို အပြည့်ချဲ့ပေးခြင်း

        // 3. Adsgram ကို သင့်ရဲ့ Ad Unit ID (int-4537) ဖြင့် ချိတ်ဆက်ခြင်း
        const adController = window.Adsgram.init({ blockId: "int-4537" });

        // ကြော်ငြာပြသပြီး သေတ္တာဖွင့်မည့် လုပ်ဆောင်ချက်
        function watchAdAndOpenChest() {
            const adButton = document.getElementById("ad-button");
            const statusText = document.getElementById("status-text");

            // ခလုတ်ကို ခေတ္တပိတ်ထားပြီး စာသားပြောင်းပါ
            if (adButton) {
                adButton.disabled = true;
                adButton.innerText = "Loading Ad...";
            }
            statusText.innerText = "ကြော်ငြာကို စနစ်က ခေါ်ယူနေပါသည်...";

            // ကြော်ငြာကို စတင်ပြသခြင်း
            adController.show()
                .then((result) => {
                    // ကြော်ငြာကို အဆုံးထိ ကြည့်ရှုပြီးသွားချိန် (Reward ပေးရန်)
                    statusText.innerText = "ကြော်ငြာကြည့်ရှုမှု အောင်မြင်သည်။";
                    openChest(); // သေတ္တာဖွင့်သည့် လုပ်ဆောင်ချက်ကို လှမ်းခေါ်ခြင်း
                })
                .catch((result) => {
                    // ကြော်ငြာကြည့်နေတုန်း အမှားအယွင်းဖြစ်ခြင်း သို့မဟုတ် အသုံးပြုသူက ပိတ်ပစ်ခြင်း
                    console.error("Adsgram Error or Skipped:", result);
                    statusText.innerText = "ကြော်ငြာကြည့်ရှုမှု မအောင်မြင်ပါ။";
                    alert("ဆုလာဘ်ရယူရန် ကြော်ငြာကို အဆုံးထိ ပြီးအောင်ကြည့်ပေးပါ။");
                })
                .finally(() => {
                    // ခလုတ်ကို မူလအတိုင်း ပြန်ဖွင့်ပေးခြင်း
                    if (adButton) {
                        adButton.disabled = false;
                        adButton.innerText = "WATCH ADS TO OPEN";
                    }
                });
        }

        // သေတ္တာအမှန်တကယ် ပွင့်သွားသည့် လုပ်ဆောင်ချက်
        function openChest() {
            const chestEmoji = document.getElementById("chest-emoji");
            const statusText = document.getElementById("status-text");
            const adButton = document.getElementById("ad-button");

            // အန်နီမေးရှင်းပုံစံ သေတ္တာဖွင့်ပြခြင်း
            chestEmoji.innerText = "🔓🎁";
            statusText.innerText = "🎉 ဝမ်းမြောက်ပါသည်! သေတ္တာပွင့်သွားပါပြီ။";
            adButton.style.display = "none"; // ဖွင့်ပြီးသွားရင် ခလုတ်ကို ဖျောက်ထားခြင်း

            // ဒေတာဘေ့စ် (Firebase/Backend) ထဲသို့ အမှတ်လှမ်းပေါင်းလိုပါက ဒီနေရာတွင် ကုဒ်ထည့်နိုင်ပါသည်
            console.log("User rewarded successfully.");
        }
    </script>
</body>
</html>
