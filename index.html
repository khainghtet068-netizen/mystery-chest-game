<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystery Chest Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #141423, #080811);
            color: white; font-family: 'Segoe UI', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; height: 100vh; overflow: hidden; user-select: none;
        }
        .header { margin-top: 20px; font-size: 1.8rem; font-weight: bold; letter-spacing: 2px; color: #f39c12; }
        .coins-display { background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 20px; font-size: 1.2rem; font-weight: bold; margin-top: 5px; box-shadow: 0 0 10px rgba(241, 196, 15, 0.2); }
        .main-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        
        /* Box Styling */
        .chest-box { width: 180px; height: 180px; background: radial-gradient(circle, #f39c12, #d35400); border-radius: 20px; box-shadow: 0 10px 30px rgba(211, 84, 0, 0.5); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 4.5rem; transition: transform 0.1s ease; }
        .chest-box:active { transform: scale(0.9); }
        .open-btn { margin-top: 25px; padding: 12px 35px; background: #27ae60; color: white; border: none; border-radius: 25px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4); }
        
        /* Collection Section */
        .collection-section { width: 90%; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px 15px 0 0; box-sizing: border-box; margin-bottom: 0; }
        .collection-title { font-size: 0.9rem; color: #bdc3c7; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .inventory { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; width: 100%; }
        .card-slot { min-width: 75px; height: 100px; background: rgba(0,0,0,0.4); border: 1px dashed #7f8c8d; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; position: relative; cursor: pointer; }
        .card-slot.filled { border-style: solid; background: #2c3e50; }
        .card-slot.legendary { border-color: #f1c40f; box-shadow: inset 0 0 10px rgba(241, 196, 15, 0.5); }
        .card-slot.common { border-color: #95a5a6; }
        .card-value { color: #f1c40f; font-weight: bold; margin-top: 5px; }

        /* Popup Setup */
        .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 10; }
        .popup-content { background: #1a1a2e; padding: 30px; border-radius: 20px; text-align: center; border: 2px solid #f1c40f; width: 80%; max-width: 300px; }
        .popup-btn { margin-top: 20px; padding: 10px 20px; background: #e67e22; border: none; color: white; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">MYSTERY CHEST</div>
    <div class="coins-display">💰 <span id="coin-count">100</span> COINS</div>

    <div class="main-container">
        <div class="chest-box" id="chest" onclick="openChest()">📦</div>
        <button class="open-btn" onclick="openChest()">OPEN (FREE)</button>
    </div>

    <div class="collection-section">
        <div class="collection-title">My Collection</div>
        <div class="inventory" id="inventory">
            </div>
    </div>

    <div class="popup" id="trade-popup">
        <div class="popup-content">
            <h3 id="popup-card-name">Card Name</h3>
            <p id="popup-card-tier">Tier</p>
            <button class="popup-btn" id="trade-action-btn">TRADE FOR COINS</button>
            <button class="popup-btn" style="background:#7f8c8d;" onclick="closePopup()">CLOSE</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let coins = parseInt(localStorage.getItem('chest_coins')) || 100;
        let myCards = JSON.parse(localStorage.getItem('my_cards')) || [];
        
        const cardPool = [
            { id: 1, name: "Dragon", tier: "LEGENDARY", value: 50, icon: "🐲" },
            { id: 2, name: "Phoenix", tier: "LEGENDARY", value: 50, icon: "🦅" },
            { id: 3, name: "Sword", tier: "COMMON", value: 10, icon: "⚔️" },
            { id: 4, name: "Shield", tier: "COMMON", value: 10, icon: "🛡️" }
        ];

        function updateUI() {
            document.getElementById('coin-count').innerText = coins;
            const inv = document.getElementById('inventory');
            inv.innerHTML = '';
            
            if(myCards.length === 0) {
                inv.innerHTML = '<div style="color:#7f8c8d; font-size:0.9rem; padding: 20px;">No cards yet. Open a chest!</div>';
            }

            myCards.forEach((card, index) => {
                const slot = document.createElement('div');
                slot.className = `card-slot filled ${card.tier.toLowerCase()}`;
                slot.innerHTML = `<div>${card.icon}</div><div>${card.name}</div><div class="card-value">+${card.value}</div>`;
                slot.onclick = () => showTradePopup(index);
                inv.appendChild(slot);
            });
        }

        function openChest() {
            // Random ကတ်နှိုက်ခြင်း
            const rolled = cardPool[Math.floor(Math.random() * cardPool.length)];
            myCards.push(rolled);
            localStorage.setItem('my_cards', JSON.stringify(myCards));
            
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
            
            alert(`🎉 You found a ${rolled.tier} card: ${rolled.name}!`);
            updateUI();
        }

        let selectedCardIndex = null;
        function showTradePopup(index) {
            selectedCardIndex = index;
            const card = myCards[index];
            document.getElementById('popup-card-name').innerText = card.name + " " + card.icon;
            document.getElementById('popup-card-tier').innerText = `Tier: ${card.tier}`;
            document.getElementById('trade-action-btn').innerText = `TRADE FOR +${card.value} COINS`;
            document.getElementById('trade-popup').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('trade-popup').style.display = 'none';
        }

        document.getElementById('trade-action-btn').onclick = () => {
            if(selectedCardIndex !== null) {
                const card = myCards[selectedCardIndex];
                coins += card.value;
                myCards.splice(selectedCardIndex, 1); // ကတ်ကို ထုတ်လိုက်တာ
                
                localStorage.setItem('chest_coins', coins);
                localStorage.setItem('my_cards', JSON.stringify(myCards));
                
                closePopup();
                updateUI();
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        };

        updateUI();
    </script>
</body>
</html>
